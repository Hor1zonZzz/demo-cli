[project]
name = "demo-cli"
version = "0.1.0"
description = "A CLI agent with file operation tools"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp>=1.25.0",
    "openai>=2.14.0",
    "openai-agents[litellm]>=0.6.4",
    "prompt-toolkit>=3.0.52",
    "python-dotenv>=1.2.1",
    "rich>=14.2.0",
    "simple-term-menu>=1.6.6",
]

[project.scripts]
demo-cli = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cli", "cli_agents", "mcp_support", "sessions", "tools"]
include = ["main.py"]
